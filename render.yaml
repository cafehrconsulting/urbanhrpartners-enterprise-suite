services:
  - type: web
    name: urbanhrpartners-enterprise-suite
    env: python
    plan: free
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn app:app"
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.10
      - key: FLASK_DEBUG
        value: "0"