{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2>👥 HRIS: Employee Management</h2>
    <div class="row">
        <div class="col-md-4">
            <form action="/add_employee" method="POST" class="card p-3 shadow-sm">
                <input type="text" name="name" class="form-control mb-2" placeholder="Employee Name" required>
                <input type="text" name="position" class="form-control mb-2" placeholder="Position">
                <input type="number" name="points" class="form-control mb-2" placeholder="Starting Points (100)">
                <button type="submit" class="btn btn-success w-100">Add Employee</button>
            </form>
        </div>
        <div class="col-md-8">
            <table class="table border">
                <thead><tr><th>Name</th><th>Position</th><th>Points</th></tr></thead>
                <tbody>
                    {% for emp in employees %}
                    <tr><td>{{ emp.name }}</td><td>{{ emp.position }}</td><td>{{ emp.points }}</td></tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
