{% extends "base.html" %}
{% block content %}
<div class="row justify-content-center align-items-center" style="min-height: 60vh;">
    <div class="col-md-5">
        <div class="card shadow-lg p-5 border-0 rounded-4">
            <h1 class="fw-bold text-center mb-2">Login</h1>
            <p class="text-center text-muted mb-4">Please sign in to access the Urban HR Suite</p>
            
            {% with messages = get_flashed_messages() %}
              {% if messages %}
                {% for message in messages %}
                  <div class="alert alert-warning border-0 small py-2 mb-3">{{ message }}</div>
                {% endfor %}
              {% endif %}
            {% endwith %}

            <form method="POST">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Username</label>
                    <input type="text" name="username" class="form-control form-control-lg bg-light" placeholder="admin" required>
                </div>
                <div class="mb-4">
                    <label class="form-label fw-semibold">Password</label>
                    <input type="password" name="password" class="form-control form-control-lg bg-light" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm fw-bold">Enter Dashboard</button>
            </form>
        </div>
    </div>
</div>
{% endblock %}
