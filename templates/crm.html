<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <style>
        body { background-color: #0d1117; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 40px; }
        .form-container { 
            max-width: 500px; margin: auto; padding: 30px; 
            border: 2px solid #D4AF37; border-radius: 12px; background: #00122e; 
        }
        input { 
            width: 100%; padding: 12px; margin: 10px 0; 
            background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 5px; 
        }
        button { 
            width: 100%; padding: 15px; background: #D4AF37; color: #000; 
            border: none; font-weight: bold; cursor: pointer; border-radius: 5px; 
        }
    </style>
</head>
<body>
    <div class="form-container">
        <h2 style="text-align: center; color: #D4AF37;">NEW CRM LEAD</h2>
        <form action="/add_lead" method="POST">
            <input type="text" name="company_name" placeholder="Company Name" required>
            <input type="number" name="estimated_budget" placeholder="Estimated Budget" step="0.01">
            <button type="submit">SAVE LEAD TO PIPELINE</button>
        </form>
    </div>
</body>
</html>
