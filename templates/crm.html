{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2 class="text-primary fw-bold mb-4">🤝 CRM & Marketing Management</h2>

    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm p-4 border-0 bg-light">
                <h5>Add New Lead</h5>
                <hr>
                <form action="/add_client" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Company Name</label>
                        <input type="text" name="name" class="form-control" placeholder="e.g. Acme Corp" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Marketing Source</label>
                        <select name="source" class="form-select">
                            <option value="LinkedIn">LinkedIn</option>
                            <option value="Referral">Referral</option>
                            <option value="Cold Call">Cold Call</option>
                            <option value="Web Form">Web Form</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Estimated Budget ($)</label>
                        <input type="number" name="budget" class="form-control" placeholder="5000">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Save Lead</button>
                </form>
            </div>
        </div>

        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Company</th>
                            <th>Source</th>
                            <th>Budget</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for client in clients %}
                        <tr>
                            <td><strong>{{ client.name }}</strong></td>
                            <td>{{ client.source }}</td>
                            <td>${{ "{:,.2f}".format(client.budget) }}</td>
                            <td><span class="badge bg-warning text-dark">Lead</span></td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="4" class="text-center py-4 text-muted">No clients registered.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
