{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2 class="text-info fw-bold mb-4">🎯 ATS: Recruitment & Job Openings</h2>
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-4 bg-light">
                <h5>Post New Vacancy</h5>
                <hr>
                <form action="/add_vacancy" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Job Title</label>
                        <input type="text" name="title" class="form-control" placeholder="e.g. Sales Manager" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Department</label>
                        <input type="text" name="department" class="form-control" placeholder="e.g. Commercial">
                    </div>
                    <button type="submit" class="btn btn-info text-white w-100">Publish Opening</button>
                </form>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Position</th>
                            <th>Department</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for job in vacancies %}
                        <tr>
                            <td><strong>{{ job.title }}</strong></td>
                            <td>{{ job.department }}</td>
                            <td><span class="badge bg-secondary">Pending SOP</span></td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3" class="text-center py-4 text-muted">No vacancies posted yet.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
