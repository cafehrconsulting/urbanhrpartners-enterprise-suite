{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <h2 class="text-danger fw-bold mb-4">🛡️ SGSST: Risk & Safety Management</h2>
    <div class="row">
        <div class="col-md-4">
            <div class="card shadow-sm border-0 p-4 bg-light">
                <h5>Report New Hazard</h5>
                <hr>
                <form action="/add_risk" method="POST">
                    <div class="mb-3">
                        <label class="form-label">Hazard Description</label>
                        <input type="text" name="hazard" class="form-control" placeholder="e.g. Fire exit blocked" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Risk Level</label>
                        <select name="level" class="form-select">
                            <option value="Low">Low</option>
                            <option value="Medium">Medium</option>
                            <option value="High">High</option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-danger w-100">Log Risk</button>
                </form>
            </div>
        </div>
        <div class="col-md-8">
            <div class="card shadow-sm border-0">
                <table class="table table-hover align-middle mb-0">
                    <thead class="table-dark">
                        <tr>
                            <th>Hazard</th>
                            <th>Level</th>
                            <th>Status</th>
                        </tr>
                    </thead>
                    <tbody>
                        {% for risk in risks %}
                        <tr>
                            <td>{{ risk.hazard }}</td>
                            <td><span class="badge {% if risk.level == 'High' %}bg-danger{% else %}bg-warning{% endif %}">{{ risk.level }}</span></td>
                            <td><span class="text-danger small fw-bold">OPEN</span></td>
                        </tr>
                        {% else %}
                        <tr>
                            <td colspan="3" class="text-center py-4 text-muted">No risks reported.</td>
                        </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>
{% endblock %}
