{% extends "base.html" %}
{% block content %}
<div class="container mt-5">
    <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-3">
        <h2 class="text-dark fw-bold">📊 Executive Analytics Hub</h2>
        <button class="btn btn-outline-dark btn-sm" onclick="window.print()">🖨️ Export PDF</button>
    </div>
    
    <div class="row g-4 mb-5">
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3 text-center bg-primary text-white">
                <small class="text-uppercase opacity-75">Pipeline Budget</small>
                <h3 class="fw-bold">${{ "{:,.0f}".format(budget) }}</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3 text-center bg-success text-white">
                <small class="text-uppercase opacity-75">Team Score</small>
                <h3 class="fw-bold">{{ points }}</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3 text-center bg-danger text-white">
                <small class="text-uppercase opacity-75">Safety Risks</small>
                <h3 class="fw-bold">{{ risks }}</h3>
            </div>
        </div>
        <div class="col-md-3">
            <div class="card border-0 shadow-sm p-3 text-center bg-info text-white">
                <small class="text-uppercase opacity-75">Open Jobs</small>
                <h3 class="fw-bold">{{ jobs }}</h3>
            </div>
        </div>
    </div>

    <div class="row">
        <div class="col-md-8">
            <div class="card border-0 shadow-sm p-4">
                <h5 class="fw-bold mb-4">Module Distribution</h5>
                <canvas id="mainChart" height="150"></canvas>
            </div>
        </div>
        <div class="col-md-4">
            <div class="card border-0 shadow-sm p-4">
                <h5 class="fw-bold mb-4">Health Check</h5>
                <canvas id="healthChart"></canvas>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    // Bar Chart Logic
    const ctx = document.getElementById('mainChart').getContext('2d');
    new Chart(ctx, {
        type: 'bar',
        data: {
            labels: ['CRM ($)', 'HRIS (Pts)', 'Risks', 'Jobs'],
            datasets: [{
                label: 'System Performance Metrics',
                data: [{{ budget }}, {{ points }}, {{ risks }}, {{ jobs }}],
                backgroundColor: ['#0d6efd', '#198754', '#dc3545', '#0dcaf0']
            }]
        },
        options: { responsive: true, plugins: { legend: { display: false } } }
    });

    // Doughnut Chart Logic
    const healthCtx = document.getElementById('healthChart').getContext('2d');
    new Chart(healthCtx, {
        type: 'doughnut',
        data: {
            labels: ['Active', 'Pending'],
            datasets: [{
                data: [94, 6],
                backgroundColor: ['#198754', '#e9ecef']
            }]
        }
    });
</script>
{% endblock %}
