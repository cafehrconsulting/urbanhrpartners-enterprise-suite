<section class="panel-card">

<h2>Accounts Payable</h2>

<form method="POST" action="{{ url_for('create_payable') if 'create_payable' is defined else '#' }}">

<input type="text" name="vendor" placeholder="Vendor">

<input type="number" step="0.01" name="amount" placeholder="Amount">

<input type="date" name="due_date">

<select name="status">
<option>Pending</option>
<option>Paid</option>
</select>

<button class="btn btn-primary">Add Payable</button>

</form>

<table class="data-table">

<thead>
<tr>
<th>Vendor</th>
<th>Amount</th>
<th>Due Date</th>
<th>Status</th>
</tr>
</thead>

<tbody>

{% if payables is defined %}
{% for p in payables %}

<tr>
<td>{{ p.vendor }}</td>
<td>{{ p.amount }}</td>
<td>{{ p.due_date }}</td>
<td>{{ p.status }}</td>
</tr>

{% endfor %}
{% endif %}

</tbody>

</table>

</section>
